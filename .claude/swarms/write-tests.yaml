# .claude/swarms/write-tests.yaml
# Write Tests Swarm
# Write tests for existing code

swarm_name: "write-tests"
version: "1.0"
strategy: "sequential"

description: |
  Workflow for writing tests for existing code.
  Useful when there is code without tests or insufficient coverage.

# Required context
required_context:
  - ".claude/rules/testing.rules"
  - "Code to test"
  - "Current coverage report"

# User inputs
inputs:
  - name: "target_files"
    description: "Files to test"
    type: "list"
    required: true
    example: ["app/services/projects.py"]

  - name: "coverage_target"
    description: "Target coverage"
    type: "int"
    default: 80

  - name: "test_type"
    description: "Type of tests"
    type: "enum"
    options: ["unit", "integration", "both"]
    default: "unit"

# Participants
participants:
  - agent: "architect.agent"
    phase: "analysis"
    task: |
      1. Analyze code to test
      2. Identify necessary test cases
      3. Identify dependencies to mock
      4. Propose test structure
    output_to: "tester.agent"
    analysis_output:
      - "List of functions/classes to test"
      - "Test cases per function"
      - "Identified dependencies"

  - agent: "tester.agent"
    phase: "implementation"
    task: |
      1. Create test file
      2. Implement necessary fixtures
      3. Write tests following testing.rules
      4. Use AAA or Given-When-Then pattern
      5. Cover normal cases and edge cases
    depends_on: "architect.agent"
    output_to: "coder.agent"
    follow_rules:
      - "testing.rules"

  - agent: "coder.agent"
    phase: "verification"
    task: |
      1. Run pytest
      2. Verify coverage
      3. If coverage < target, suggest additional tests
    depends_on: "tester.agent"
    verification_commands:
      - "pytest tests/{test_file} -v"
      - "pytest --cov={module} --cov-report=term-missing"

# Test template
test_template: |
  """Tests for {module_name}."""
  import pytest
  from {import_path} import {function_or_class}

  # ============================================
  # Fixtures
  # ============================================

  @pytest.fixture
  def sample_data():
      """Test data."""
      return {sample_data}

  # ============================================
  # Tests - {function_name}
  # ============================================

  def test_{function_name}_success(sample_data):
      """Test successful case."""
      # Arrange
      {arrange_code}

      # Act
      result = {function_call}

      # Assert
      {assertions}

  def test_{function_name}_edge_case():
      """Test edge case."""
      pass

  def test_{function_name}_error_case():
      """Test error case."""
      with pytest.raises({exception_type}):
          {function_call_with_bad_data}

# Test types by layer
test_patterns:
  services:
    - "Test with valid data"
    - "Test with invalid data"
    - "Test with edge data"
    - "Test expected exceptions"

  repositories:
    - "Test basic CRUD"
    - "Test specific queries"
    - "Test transactions"

  endpoints:
    - "Test status codes"
    - "Test response body"
    - "Test input validation"
    - "Test authentication (if applicable)"

# Validations
validations:
  pre_run:
    - "pytest is installed"
    - "Target code exists"

  post_run:
    - "Tests pass"
    - "Coverage >= target"
    - "No flaky tests"

# Usage example
example:
  input:
    target_files: ["app/services/projects.py"]
    coverage_target: 90
    test_type: "unit"

  generated: "tests/unit/test_projects_service.py"

  sample_output: |
    """Tests for create project service."""
    import pytest
    from app.services.projects import create_project_service

    @pytest.fixture
    def valid_project_data():
        return {"name": "Test Project", "budget_allocation": 5000.00}

    def test_create_project_success(valid_project_data, db_session, admin_user):
        result = create_project_service(db_session, valid_project_data, admin_user)

        assert result.name == "Test Project"
        assert result.budget_allocation == 5000.00
        assert result.status == "active"

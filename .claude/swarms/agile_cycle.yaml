# .claude/swarms/agile_cycle.yaml
# Agile Development Cycle Swarm
# Agile development cycle with memory

swarm_name: "agile-development-cycle"
version: "2.0"
strategy: "sequential_with_memory"

description: |
  Complete agile development cycle with validations.
  Includes memory consultation and automatic auditing.
  Executed for each feature or set of tasks.

# Memory context that all agents consult
memory_context:
  - ".claude/memory/decision_log.json"
  - "stack_config.json"
  - ".claude/memory/audit_log.md"
  - ".claude/rules/"

# Participants in execution order
participants:
  - agent: "pm_orchestrator.agent"
    phase: "planning"
    task: |
      1. Receive feature request from user
      2. Decompose into user stories
      3. Estimate story points
      4. Create sprint backlog in memory/backlog/
      5. Assign tasks to appropriate agents
    output_to: "coder.agent"
    artifacts_generated:
      - "memory/backlog/sprint_XX.md"

  - agent: "coder.agent"
    phase: "implementation"
    task: |
      1. Consult stack_config.json to validate technologies
      2. Read relevant rules before implementing
      3. Implement assigned tasks
      4. Follow available skills when applicable
      5. Document changes for audit_log
    depends_on: "pm_orchestrator.agent"
    output_to: "tester.agent"
    pre_validation:
      - "Verify code uses defined stack"
      - "Verify it follows rules"

  - agent: "tester.agent"
    phase: "testing"
    task: |
      1. Write unit tests for generated code
      2. Write integration tests if applicable
      3. Run pytest with coverage
      4. Validate coverage >= 80%
      5. Report results
    depends_on: "coder.agent"
    output_to: "architect.agent"
    quality_check:
      - "pytest exit code == 0"
      - "coverage >= 80%"

  - agent: "architect.agent"
    phase: "review"
    task: |
      1. Consult decision_log.json to detect contradictions
      2. Validate code architecture
      3. Verify compliance with rules
      4. Approve or reject with specific feedback
    depends_on: "tester.agent"
    output_to: "reviewer.agent"
    decision_check:
      - "No contradictions with previous decisions"
      - "Consistent architecture"

  - agent: "reviewer.agent"
    phase: "documentation"
    task: |
      1. Update audit_log.md with changes
      2. Update documentation if necessary
      3. Generate changelog entry
    depends_on: "architect.agent"
    artifacts_updated:
      - "memory/audit_log.md"
      - "docs/API.md (if new endpoints)"

# Quality gates — conditions that must be met
quality_gates:
  - name: "tests_pass"
    condition: "pytest exit code == 0"
    on_fail:
      action: "return_to_agent"
      agent: "coder.agent"
      feedback: "Tests failed, review implementation"

  - name: "coverage_met"
    condition: "coverage >= 80%"
    on_fail:
      action: "return_to_agent"
      agent: "tester.agent"
      feedback: "Insufficient coverage, add more tests"

  - name: "architect_approved"
    condition: "architect.output contains 'APPROVED'"
    on_fail:
      action: "return_to_agent"
      agent: "coder.agent"
      feedback: "Include architect feedback"

  - name: "no_contradictions"
    condition: "no decision_log contradictions"
    on_fail:
      action: "escalate_to_user"
      message: "Decision contradicts history, requires approval"

# Iteration limits
iteration_limits:
  max_iterations: 3
  on_max_iterations:
    action: "escalate_to_user"
    message: "Cycle exceeded maximum iterations"

# Actions on successful completion
on_success:
  - action: "update_audit_log"
    details: "Record completed changes"
  - action: "move_to_done"
    details: "Move tasks to memory/backlog/done.md"
  - action: "notify"
    target: "pm_orchestrator"
    message: "Sprint tasks completed"

# Optional hooks
hooks:
  pre_cycle:
    - "Verify memory files exist"
    - "Backup critical files"
  post_cycle:
    - "Generate change summary"
    - "Update roadmap if applicable"

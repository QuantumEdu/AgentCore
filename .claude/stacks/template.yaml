---
# Stack Template - Base para crear nuevos stacks

stack:
  name: "Stack Template"
  version: "1.0"
  description: "Descripción del stack y cuándo usarlo"
  
  triggers:
    - "[x] Stack Template en Brief"
    - "menciona tecnología X"
  
  brief_mapping:
    project_type:
      "web_saas": "web_saaS"
      "app_desktop": "desktop_app"
    
    criticalidad:
      "low": {"scale": "small"}
      "medium": {"scale": "small"}
      "high": {"scale": "medium"}
      "critical": {"scale": "large"}
  
  automatic_decisions:
    ids:
      value: "autoincrement"
      rationale: "Razón técnica"
      forbidden: []
    
    auth:
      method: "JWT"
      library: "library específica"
      hash: "bcrypt"
    
    testing:
      framework: "pytest"
      coverage: 80
  
  patterns: []
  modules: []
  directory_structure: []
  commands: {}
  dependencies: {}
  deployment: {}
  business_rules: []

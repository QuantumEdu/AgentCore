---
# FastAPI Stack B: SPA (Single Page Application)

substack:
  id: "fastapi_spa"
  name: "Stack B: SPA (React 18 + MUI + TanStack Query)"
  description: "Single Page Application ideal para productos SaaS vendibles con UI táctil premium"

  triggers:
    - "[x] FastAPI Stack B"
    - "React"
    - "MUI"
    - "SPA"
    - "producto vendible"
    - "UI táctil"
    - "POS moderno"

  frontend:
    framework: "React 18 + TypeScript 5"
    bundler: "Vite 5"
    ui: "MUI v6"
    state: "Zustand v4"
    fetching: "TanStack Query v5"
    forms: "React Hook Form + Zod"
    routing: "React Router v6"
    rationale: "UI moderna, componentes pre-construidos, excelente DX"

  patterns:
    - "Server Components (si Next.js) o Client Components"
    - "TanStack Query para data fetching con cache"
    - "Zustand para estado global mínimo"
    - "React Hook Form + Zod para validación"
    - "MUI DataGrid para tablas"

  structure:
    - "frontend/src/"
    - "frontend/src/components/"
    - "frontend/src/pages/"
    - "frontend/src/hooks/"
    - "frontend/src/store/"
    - "frontend/src/api/"
    - "frontend/src/types/"

  examples:
    - "useQuery para fetch data con staleTime"
    - "useMutation para mutations con invalidación"
    - "MUI Dialog modales con Formik"
    - "Zustand store para auth state"

  tradeoffs:
    - "✅ UI moderna y consistente (MUI)"
    - "✅ Interactividad fluida (SPA)"
    - "✅ Excelente DX (TypeScript, Vite)"
    - "✅ Ecosistema rico (librerías React)"
    - "❌ Requiere build step (Vite)"
    - "❌ Más complejo que SSR"
    - "❌ Curva de aprendizaje más alta"

  use_cases:
    - "Productos SaaS vendibles"
    - "Aplicaciones POS modernas"
    - "Dashboards con alta interactividad"
    - "Sistemas donde el UX premium es crítico"

  not_recommended_for:
    - "Apps simples donde SSR es suficiente"
    - "Equipos sin experiencia React"
    - "Proyectos con presupuesto muy limitado"

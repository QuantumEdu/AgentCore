name: testing
description: "Módulo de testing con pytest, pytest-asyncio y fixtures completos"
version: 2.0.0

stack:
  - "pytest>=7.4.3"
  - "pytest-asyncio>=0.21.1"
  - "pytest-cov>=4.1.0"
  - "httpx>=0.25.2"
  - "faker>=20.1.0"
  - "freezegun>=1.4.0"
  - "playwright>=1.40.0"

dependencies:
  - auth
  - database

configuration:
  pytest:
    asyncio_mode: "auto"
    testpaths: ["tests"]
    python_files: ["test_*.py", "*_test.py"]
    python_classes: ["Test*"]
    python_functions: ["test_*"]
    addopts: >
      --strict-markers
      --strict-config
      --cov=app
      --cov-report=term-missing
      --cov-report=html
      --cov-fail-under=80
      -v
    markers:
      - "slow: marks tests as slow (deselect with '-m \"not slow\"')"
      - "integration: marks tests as integration tests"
      - "e2e: marks tests as end-to-end tests"
      - "unit: marks tests as unit tests"
      - "auth: marks tests as authentication-related"
      - "db: marks tests as database-related"

  coverage:
    minimum: 80
    omit:
      - "*/tests/*"
      - "*/migrations/*"
      - "*/__init__.py"
      - "*/conftest.py"
      - "*/alembic/*"

fixtures:
  database:
    db_session:
      code: |
        import pytest
        from sqlalchemy.ext.asyncio import create_async_engine, AsyncSession, async_sessionmaker
        from app.infrastructure.persistence.base import Base
        from typing import AsyncGenerator

        @pytest.fixture
        async def db_session() -> AsyncGenerator[AsyncSession, None]:
            """
            Create a test database session with in-memory SQLite.
            Creates all tables at the start and drops them at the end.
            """
            engine = create_async_engine(
                "sqlite+aiosqlite:///:memory:",
                echo=False,
                future=True
            )

            async with engine.begin() as conn:
                await conn.run_sync(Base.metadata.create_all)

            async_session_maker = async_sessionmaker(
                engine,
                class_=AsyncSession,
                expire_on_commit=False,
            )

            async with async_session_maker() as session:
                yield session

            await engine.dispose()

  http_client:
    client:
      code: |
        import pytest
        from httpx import AsyncClient, ASGITransport
        from app.main import app
        from typing import AsyncGenerator

        @pytest.fixture
        async def client() -> AsyncGenerator[AsyncClient, None]:
            """
            Create an async HTTP client for testing FastAPI endpoints.
            """
            async with AsyncClient(
                transport=ASGITransport(app=app),
                base_url="http://test"
            ) as ac:
                yield ac

  authentication:
    authenticated_client:
      code: |
        import pytest
        from httpx import AsyncClient, ASGITransport
        from app.main import app
        from app.infrastructure.persistence.models import User
        from app.application.auth.services import PasswordService, JWTService
        from sqlalchemy.ext.asyncio import AsyncSession
        from typing import AsyncGenerator

        @pytest.fixture
        async def authenticated_client(
            db_session: AsyncSession
        ) -> AsyncGenerator[AsyncClient, None]:
            """
            Create an authenticated client with a test user.
            """
            password_service = PasswordService()
            jwt_service = JWTService()

            # Create test user
            user = User(
                email="test@example.com",
                password_hash=password_service.hash_password("testpassword123"),
                full_name="Test User",
                role="user",
                is_active=True
            )
            db_session.add(user)
            await db_session.commit()
            await db_session.refresh(user)

            # Create JWT token
            token = jwt_service.create_access_token({
                "sub": user.id,
                "email": user.email,
                "role": user.role
            })

            # Create authenticated client
            async with AsyncClient(
                transport=ASGITransport(app=app),
                base_url="http://test",
                headers={"Authorization": f"Bearer {token}"}
            ) as ac:
                yield ac


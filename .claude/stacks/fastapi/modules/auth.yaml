name: auth
description: "Módulo de autenticación completo para FastAPI con JWT, Argon2id y roles"
version: 2.0.0

stack:
  - "fastapi>=0.115.0"
  - "python-jose[cryptography]>=3.3.0"
  - "argon2-cffi>=23.1.0"
  - "passlib[bcrypt]>=1.7.4"
  - "pydantic>=2.5.0"
  - "pydantic-settings>=2.1.0"

dependencies:
  - database
  - testing

configuration:
  jwt_secret_key: "${JWT_SECRET:dev-secret-change-in-production-min-32-chars}"
  jwt_algorithm: "HS256"
  jwt_access_token_expire_minutes: 30
  jwt_refresh_token_expire_days: 7
  password_min_length: 8
  password_max_length: 128
  default_role: "user"

security:
  hashing:
    algorithm: "argon2id"
    time_cost: 3
    memory_cost: 65536
    parallelism: 4
    hash_len: 32
    salt_len: 16

  best_practices:
    - "Use HttpOnly cookies for SSR to prevent XSS"
    - "Use Secure flag for cookies in production (HTTPS only)"
    - "Use SameSite=Strict or Lax to prevent CSRF"
    - "Implement token rotation on refresh"
    - "Store only user_id and role in JWT (minimal payload)"
    - "Validate token signature and expiration on every request"
    - "Use short-lived access tokens (15-30 min) with refresh tokens"
    - "Implement rate limiting on login/register endpoints"
    - "Log failed authentication attempts"
    - "Never store plain passwords or reversible hashes"
    - "Use environment variables for secrets (never in code)"
    - "Implement account lockout after N failed attempts"
    - "Use constant-time comparison for sensitive operations"

endpoints:
  login:
    method: "POST"
    path: "/api/v1/auth/login"
    description: "Authenticate user and return tokens"
    request:
      email: "string (email format)"
      password: "string"
    response:
      access_token: "string (JWT)"
      refresh_token: "string"
      token_type: "bearer"
      expires_in: "int (seconds)"

  register:
    method: "POST"
    path: "/api/v1/auth/register"
    description: "Register new user"
    request:
      email: "string (email format)"
      password: "string (min 8 chars)"
      full_name: "string"
      role: "string (optional, default: user)"
    response:
      id: "int"
      email: "string"
      full_name: "string"
      role: "string"

  refresh:
    method: "POST"
    path: "/api/v1/auth/refresh"
    description: "Refresh access token using refresh token"
    request:
      refresh_token: "string"
    response:
      access_token: "string (JWT)"
      token_type: "bearer"
      expires_in: "int (seconds)"

  logout:
    method: "POST"
    path: "/api/v1/auth/logout"
    description: "Invalidate refresh token (client-side + server-side tracking)"
    auth_required: true
    response:
      message: "Successfully logged out"

  me:
    method: "GET"
    path: "/api/v1/auth/me"
    description: "Get current user profile"
    auth_required: true
    response:
      id: "int"
      email: "string"
      full_name: "string"
      role: "string"
      created_at: "datetime"
      updated_at: "datetime"

  update_profile:
    method: "PUT"
    path: "/api/v1/auth/profile"
    description: "Update current user profile"
    auth_required: true
    request:
      full_name: "string (optional)"
      email: "string (optional, email format)"
    response:
      id: "int"
      email: "string"
      full_name: "string"
      role: "string"
      updated_at: "datetime"

  change_password:
    method: "POST"
    path: "/api/v1/auth/change-password"
    description: "Change current user password"
    auth_required: true
    request:
      current_password: "string"
      new_password: "string (min 8 chars)"
    response:
      message: "Password changed successfully"

middleware:
  authentication:
    code: |
      from fastapi import Request, HTTPException, status
      from fastapi.security import HTTPBearer, HTTPAuthorizationCredentials
      from jose import JWTError, jwt
      from app.core.config import settings
      from app.infrastructure.persistence.models import User
      from sqlalchemy import select
      from sqlalchemy.ext.asyncio import AsyncSession

      security = HTTPBearer(auto_error=False)

      async def get_current_user(
          request: Request,
          credentials: HTTPAuthorizationCredentials = Depends(security),
          db: AsyncSession = Depends(get_db)
      ) -> User:
          """
          Dependency to get current authenticated user from JWT token.
          Supports both Authorization header and HttpOnly cookie.
          """
          token = None

          # Try to get token from Authorization header
          if credentials:
              token = credentials.credentials
          else:
              # Try to get token from HttpOnly cookie (for SSR)
              token = request.cookies.get("access_token")

          if not token:
              raise HTTPException(
                  status_code=status.HTTP_401_UNAUTHORIZED,
                  detail="Not authenticated",
                  headers={"WWW-Authenticate": "Bearer"},
              )

          try:
              # Remove "Bearer " prefix if present
              if token.startswith("Bearer "):
                  token = token[7:]

              payload = jwt.decode(
                  token,
                  settings.jwt_secret_key,
                  algorithms=[settings.jwt_algorithm]
              )
              user_id: int = payload.get("sub")
              if user_id is None:
                  raise HTTPException(
                      status_code=status.HTTP_401_UNAUTHORIZED,
                      detail="Invalid token payload"
                  )
          except JWTError:
              raise HTTPException(
                  status_code=status.HTTP_401_UNAUTHORIZED,
                  detail="Could not validate credentials"
              )

          # Fetch user from database
          result = await db.execute(
                select(User).where(User.id == user_id)
            )
          user = result.scalar_one_or_none()

          if user is None:
              raise HTTPException(
                  status_code=status.HTTP_401_UNAUTHORIZED,
                  detail="User not found"
              )

          if user.deleted_at is not None:
              raise HTTPException(
                  status_code=status.HTTP_401_UNAUTHORIZED,
                  detail="User account is deleted"
              )

          return user

  authorization:
    code: |
      from functools import wraps
      from fastapi import HTTPException, status
      from typing import List

      def require_role(*allowed_roles: str):
          """
          Decorator to restrict access to specific roles.
          Usage: @require_role("admin", "manager")
          """
          def decorator(func):
              @wraps(func)
              async def wrapper(*args, current_user: User, **kwargs):
                  if current_user.role not in allowed_roles:
                      raise HTTPException(
                          status_code=status.HTTP_403_FORBIDDEN,
                          detail=f"Insufficient permissions. Required roles: {', '.join(allowed_roles)}"
                      )
                  return await func(*args, current_user=current_user, **kwargs)
              return wrapper
          return decorator

      def require_any_role(roles: List[str]):
          """
          Alternative syntax for role-based access control.
          Usage: @require_any_role(["admin", "manager"])
          """
          return require_role(*roles)

      # Example endpoint using authorization
      # @router.get("/admin/dashboard")
      # @require_role("admin")
      # async def admin_dashboard(current_user: User = Depends(get_current_user)):
      #     return {"message": "Welcome admin", "user": current_user.email}

models:
  user:
    code: |
      from sqlalchemy.orm import Mapped, mapped_column
      from sqlalchemy import String, Boolean, DateTime
      from datetime import datetime
      from app.infrastructure.persistence.base import TimestampMixin, SoftDeleteMixin

      class User(TimestampMixin, SoftDeleteMixin):
          __tablename__ = "users"

          id: Mapped[int] = mapped_column(primary_key=True, autoincrement=True)
          email: Mapped[str] = mapped_column(String(255), nullable=False, unique=True, index=True)
          password_hash: Mapped[str] = mapped_column(String(255), nullable=False)
          full_name: Mapped[str] = mapped_column(String(255), nullable=False)
          role: Mapped[str] = mapped_column(String(50), nullable=False, default="user", index=True)
          is_active: Mapped[bool] = mapped_column(Boolean, default=True, nullable=False)
          last_login_at: Mapped[datetime | None] = mapped_column(DateTime, nullable=True)

          def __repr__(self) -> str:
              return f"<User(id={self.id}, email='{self.email}', role='{self.role}')>"

  roles:
    enum:
      name: "UserRole"
      values:
        - "superadmin"
        - "admin"
        - "manager"
        - "user"
        - "guest"
    default: "user"

services:
  password_service:
    code: |
      from argon2 import PasswordHasher
      from argon2.exceptions import VerifyMismatchError

      class PasswordService:
          """
          Service for password hashing and verification using Argon2id.
          Argon2id is the winner of the Password Hashing Competition (PHC)
          and is recommended for password hashing by NIST.
          """
          def __init__(self):
              self.ph = PasswordHasher(
                  time_cost=3,
                  memory_cost=65536,
                  parallelism=4,
                  hash_len=32,
                  salt_len=16
              )

          def hash_password(self, password: str) -> str:
              """
              Hash a password using Argon2id.
              The salt is included in the returned hash string.
              """
              if not password or len(password) < 8:
                  raise ValueError("Password must be at least 8 characters long")
              return self.ph.hash(password)

          def verify_password(self, password: str, hash: str) -> bool:
              """
              Verify a password against a hash.
              Returns True if password matches, False otherwise.
              """
              try:
                  self.ph.verify(hash, password)
                  return True
              except VerifyMismatchError:
                  return False

          def check_needs_rehash(self, hash: str) -> bool:
              """
              Check if a hash needs to be rehashed with updated parameters.
              Call this after successful verification and rehash if True.
              """
              return self.ph.check_needs_rehash(hash)

      # Singleton instance
      password_service = PasswordService()

  jwt_service:
    code: |
      from datetime import datetime, timedelta
      from jose import JWTError, jwt
      from typing import Optional, Dict, Any
      from app.core.config import settings

      class JWTService:
          """
          Service for creating and verifying JWT tokens.
          """
          def __init__(self):
              self.secret_key = settings.jwt_secret_key
              self.algorithm = settings.jwt_algorithm
              self.access_token_expire_minutes = settings.jwt_access_token_expire_minutes
              self.refresh_token_expire_days = settings.jwt_refresh_token_expire_days

          def create_access_token(self, data: Dict[str, Any]) -> str:
              """
              Create an access token with short expiration.
              """
              to_encode = data.copy()
              expire = datetime.utcnow() + timedelta(minutes=self.access_token_expire_minutes)
              to_encode.update({
                  "exp": expire,
                  "type": "access"
              })
              return jwt.encode(to_encode, self.secret_key, algorithm=self.algorithm)

          def create_refresh_token(self, data: Dict[str, Any]) -> str:
              """
              Create a refresh token with longer expiration.
              """
              to_encode = data.copy()
              expire = datetime.utcnow() + timedelta(days=self.refresh_token_expire_days)
              to_encode.update({
                  "exp": expire,
                  "type": "refresh"
              })
              return jwt.encode(to_encode, self.secret_key, algorithm=self.algorithm)

          def decode_token(self, token: str) -> Optional[Dict[str, Any]]:
              """
              Decode and verify a JWT token.
              Returns payload if valid, None otherwise.
              """
              try:
                  payload = jwt.decode(
                      token,
                      self.secret_key,
                      algorithms=[self.algorithm]
                  )
                  return payload
              except JWTError:
                  return None

          def verify_access_token(self, token: str) -> Optional[Dict[str, Any]]:
              """
              Verify an access token.
              Returns payload if valid and is access type, None otherwise.
              """
              payload = self.decode_token(token)
              if payload and payload.get("type") == "access":
                  return payload
              return None

          def verify_refresh_token(self, token: str) -> Optional[Dict[str, Any]]:
              """
              Verify a refresh token.
              Returns payload if valid and is refresh type, None otherwise.
              """
              payload = self.decode_token(token)
              if payload and payload.get("type") == "refresh":
                  return payload
              return None

      # Singleton instance
      jwt_service = JWTService()

testing:
  fixtures:
    test_user:
      code: |
        import pytest
        from sqlalchemy.ext.asyncio import AsyncSession
        from app.infrastructure.persistence.models import User
        from app.application.auth.services import PasswordService

        @pytest.fixture
        async def test_user(db: AsyncSession) -> User:
            """
            Create a test user for authentication testing.
            """
            password_service = PasswordService()
            user = User(
                email="test@example.com",
                password_hash=password_service.hash_password("testpassword123"),
                full_name="Test User",
                role="user",
                is_active=True
            )
            db.add(user)
            await db.commit()
            await db.refresh(user)
            return user

        @pytest.fixture
        async def test_admin(db: AsyncSession) -> User:
            """
            Create a test admin user for authorization testing.
            """
            password_service = PasswordService()
            user = User(
                email="admin@example.com",
                password_hash=password_service.hash_password("adminpassword123"),
                full_name="Admin User",
                role="admin",
                is_active=True
            )
            db.add(user)
            await db.commit()
            await db.refresh(user)
            return user

    auth_headers:
      code: |
        import pytest
        from httpx import AsyncClient
        from app.application.auth.services import JWTService

        @pytest.fixture
        async def auth_headers(client: AsyncClient, test_user: User) -> dict:
            """
            Get authentication headers with a valid JWT token.
            """
            jwt_service = JWTService()
            token = jwt_service.create_access_token({
                "sub": test_user.id,
                "email": test_user.email,
                "role": test_user.role
            })
            return {"Authorization": f"Bearer {token}"}

        @pytest.fixture
        async def admin_auth_headers(client: AsyncClient, test_admin: User) -> dict:
            """
            Get authentication headers with admin role.
            """
            jwt_service = JWTService()
            token = jwt_service.create_access_token({
                "sub": test_admin.id,
                "email": test_admin.email,
                "role": test_admin.role
            })
            return {"Authorization": f"Bearer {token}"}

  test_cases:
    login_success:
      description: "Test successful login with valid credentials"
      endpoint: "POST /api/v1/auth/login"
      request:
        email: "test@example.com"
        password: "testpassword123"
      expected_status: 200
      expected_response:
        access_token: "string"
        refresh_token: "string"
        token_type: "bearer"

    login_invalid_credentials:
      description: "Test login with invalid credentials"
      endpoint: "POST /api/v1/auth/login"
      request:
        email: "test@example.com"
        password: "wrongpassword"
      expected_status: 401
      expected_response:
        detail: "string"

    register_success:
      description: "Test successful user registration"
      endpoint: "POST /api/v1/auth/register"
      request:
        email: "newuser@example.com"
        password: "newpassword123"
        full_name: "New User"
      expected_status: 201
      expected_response:
        id: "int"
        email: "newuser@example.com"
        full_name: "New User"
        role: "user"

    refresh_token_success:
      description: "Test token refresh with valid refresh token"
      endpoint: "POST /api/v1/auth/refresh"
      request:
        refresh_token: "string (valid)"
      expected_status: 200
      expected_response:
        access_token: "string"
        token_type: "bearer"

    me_authenticated:
      description: "Test getting current user profile with valid token"
      endpoint: "GET /api/v1/auth/me"
      headers:
        Authorization: "Bearer {valid_token}"
      expected_status: 200
      expected_response:
        id: "int"
        email: "string"
        full_name: "string"
        role: "string"

    me_unauthenticated:
      description: "Test accessing protected endpoint without token"
      endpoint: "GET /api/v1/auth/me"
      expected_status: 401

    require_role_admin:
      description: "Test admin-only endpoint with admin token"
      endpoint: "GET /api/v1/auth/admin-only"
      headers:
        Authorization: "Bearer {admin_token}"
      expected_status: 200

    require_role_forbidden:
      description: "Test admin-only endpoint with user token"
      endpoint: "GET /api/v1/auth/admin-only"
      headers:
        Authorization: "Bearer {user_token}"
      expected_status: 403

    change_password_success:
      description: "Test successful password change"
      endpoint: "POST /api/v1/auth/change-password"
      headers:
        Authorization: "Bearer {valid_token}"
      request:
        current_password: "oldpassword"
        new_password: "newpassword123"
      expected_status: 200
      expected_response:
        message: "Password changed successfully"

    change_password_wrong_current:
      description: "Test password change with wrong current password"
      endpoint: "POST /api/v1/auth/change-password"
      headers:
        Authorization: "Bearer {valid_token}"
      request:
        current_password: "wrongpassword"
        new_password: "newpassword123"
      expected_status: 400

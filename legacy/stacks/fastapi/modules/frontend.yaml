name: frontend
description: "Módulo de frontend con 3 stacks: Jinja2+HTMX, React+MUI, y PyWebview"
version: 2.0.0

stacks:
  stack_a:
    name: "Web SSR (Jinja2 + HTMX + PicoCSS)"
    description: "Server-side rendering with Jinja2, HTMX for interactivity, and PicoCSS for styling"
    use_case: "Internal apps, dashboards, clinical/medical systems"

    packages:
      - "jinja2>=3.1.2"
      - "python-multipart>=0.0.6"
      - "aiofiles>=23.2.1"

    cdn_links:
      htmx: "https://unpkg.com/htmx.org@2.0.2"
      pico_css: "https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css"

    configuration:
      code: |
        # app/core/config.py
        from pydantic_settings import BaseSettings

        class Settings(BaseSettings):
            # ... other settings ...

            # Templates
            templates_dir: str = "app/templates"
            static_dir: str = "app/static"

            # Frontend
            htmx_cdn: str = "https://unpkg.com/htmx.org@2.0.2"
            pico_css_cdn: str = "https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css"

    setup:
      code: |
        # app/main.py
        from fastapi import FastAPI, Request
        from fastapi.templating import Jinja2Templates
        from fastapi.staticfiles import StaticFiles
        from fastapi.responses import HTMLResponse

        app = FastAPI()

        # Setup templates
        templates = Jinja2Templates(directory="app/templates")

        # Setup static files
        app.mount("/static", StaticFiles(directory="app/static"), name="static")

        @app.get("/", response_class=HTMLResponse)
        async def home(request: Request):
            return templates.TemplateResponse("home.html", {"request": request})

    htmx_patterns:
      auto_refresh:
        description: "Auto-refresh content at intervals"
        html_example: |
          <div hx-get="/api/dashboard/stats"
               hx-trigger="every 30s"
               hx-target="#stats-container"
               hx-swap="innerHTML">
            Loading stats...
          </div>
          <div id="stats-container">
            <!-- Stats will be loaded here -->
          </div>

      real_time_search:
        description: "Search as you type with debounce"
        html_example: |
          <input type="text"
                 name="search"
                 placeholder="Search products..."
                 hx-get="/api/products/search"
                 hx-trigger="keyup changed delay:300ms"
                 hx-target="#search-results"
                 hx-indicator="#search-indicator">

          <div id="search-indicator" class="htmx-indicator">
            Searching...
          </div>

          <div id="search-results">
            <!-- Results will appear here -->
          </div>

      inline_edit:
        description: "Edit content in place"
        html_example: |
          <div hx-get="/api/users/123/edit"
               hx-target="#user-123"
               hx-swap="outerHTML">
            <span id="user-123">John Doe</span>
          </div>

      modal_dialog:
        description: "Load modal content dynamically"
        html_example: |
          <button hx-get="/api/orders/new"
                  hx-target="#modal-container"
                  hx-swap="innerHTML">
            New Order
          </button>

          <dialog id="modal-container">
            <!-- Modal content will be loaded here -->
          </dialog>

      infinite_scroll:
        description: "Load more content on scroll"
        html_example: |
          <div id="items-list">
            <!-- Initial items -->
          </div>

          <div hx-get="/api/items?page=2"
               hx-trigger="revealed"
               hx-swap="append"
               hx-target="#items-list">
            Loading more items...
          </div>

      form_submission:
        description: "Submit form without page reload"
        html_example: |
          <form hx-post="/api/orders"
                hx-target="#order-result"
                hx-swap="outerHTML">
            <input type="text" name="customer_name" required>
            <input type="email" name="customer_email" required>
            <button type="submit">Create Order</button>
          </form>

          <div id="order-result"></div>

      delete_confirmation:
        description: "Confirm delete action"
        html_example: |
          <button hx-delete="/api/orders/123"
                  hx-confirm="Are you sure you want to delete this order?"
                  hx-target="#order-row-123"
                  hx-swap="outerHTML">
            Delete
          </button>

      progressive_enhancement:
        description: "Enhance existing HTML with HTMX"
        html_example: |
          <form action="/api/orders" method="post"
                hx-post="/api/orders"
                hx-target="#result">
            <!-- Works without JS, enhanced with HTMX -->
            <input type="text" name="name">
            <button type="submit">Submit</button>
          </form>

      csrf_protection:
        description: "CSRF token with HTMX"
        html_example: |
          <form hx-post="/api/submit">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <!-- Other form fields -->
            <button type="submit">Submit</button>
          </form>

    template_structure:
      code: |
        app/templates/
        ├── base.html              # Base template with common layout
        ├── components/            # Reusable components
        │   ├── header.html
        │   ├── footer.html
        │   ├── navbar.html
        │   ├── card.html
        │   └── table.html
        ├── pages/                 # Full page templates
        │   ├── home.html
        │   ├── dashboard.html
        │   ├── login.html
        │   └── register.html
        └── partials/              # HTMX partial fragments
            ├── user_row.html
            ├── order_item.html
            └── stats_card.html

  stack_b:
    name: "SPA Moderna (React + MUI + Zustand + TanStack Query)"
    description: "Modern Single Page Application with React ecosystem"
    use_case: "Sellable products with touch UI, POS, restaurant apps"

    packages:
      - "react>=18.2.0"
      - "react-dom>=18.2.0"
      - "@mui/material>=6.0.0"
      - "@emotion/react>=11.11.0"
      - "@emotion/styled>=11.11.0"
      - "@tanstack/react-query>=5.0.0"
      - "zustand>=4.4.0"
      - "react-hook-form>=7.48.0"
      - "zod>=3.22.0"
      - "@hookform/resolvers>=3.3.0"
      - "axios>=1.6.0"
      - "react-router-dom>=6.20.0"

    configuration:
      vite_config: |
        // vite.config.ts
        import { defineConfig } from 'vite'
        import react from '@vitejs/plugin-react'
        import path from 'path'

        export default defineConfig({
          plugins: [react()],
          resolve: {
            alias: {
              '@': path.resolve(__dirname, './src'),
            },
          },
          server: {
            port: 3000,
            proxy: {
              '/api': {
                target: 'http://localhost:8000',
                changeOrigin: true,
              },
            },
          },
        })

      tsconfig: |
        // tsconfig.json
        {
          "compilerOptions": {
            "target": "ES2020",
            "useDefineForClassFields": true,
            "lib": ["ES2020", "DOM", "DOM.Iterable"],
            "module": "ESNext",
            "skipLibCheck": true,
            "moduleResolution": "bundler",
            "allowImportingTsExtensions": true,
            "resolveJsonModule": true,
            "isolatedModules": true,
            "noEmit": true,
            "jsx": "react-jsx",
            "strict": true,
            "noUnusedLocals": true,
            "noUnusedParameters": true,
            "noFallthroughCasesInSwitch": true,
            "baseUrl": ".",
            "paths": {
              "@/*": ["./src/*"]
            }
          },
          "include": ["src"],
          "references": [{ "path": "./tsconfig.node.json" }]
        }

    setup:
      code: |
        // src/main.tsx
        import React from 'react'
        import ReactDOM from 'react-dom/client'
        import { QueryClient, QueryClientProvider } from '@tanstack/react-query'
        import { BrowserRouter } from 'react-router-dom'
        import { ThemeProvider, createTheme } from '@mui/material/styles'
        import CssBaseline from '@mui/material/CssBaseline'
        import App from './App'

        const queryClient = new QueryClient({
          defaultOptions: {
            queries: {
              staleTime: 5 * 60 * 1000, // 5 minutes
              retry: 1,
            },
          },
        })

        const theme = createTheme({
          palette: {
            primary: {
              main: '#1976d2',
            },
            secondary: {
              main: '#dc004e',
            },
          },
        })

        ReactDOM.createRoot(document.getElementById('root')!).render(
          <React.StrictMode>
            <QueryClientProvider client={queryClient}>
              <ThemeProvider theme={theme}>
                <CssBaseline />
                <BrowserRouter>
                  <App />
                </BrowserRouter>
              </ThemeProvider>
            </QueryClientProvider>
          </React.StrictMode>,
        )

    react_patterns:
      custom_hooks:
        use_auth:
          code: |
            // src/hooks/useAuth.ts
            import { useQuery, useMutation, useQueryClient } from '@tanstack/react-query'
            import axios from 'axios'

            interface LoginData {
              email: string
              password: string
            }

            interface AuthResponse {
              access_token: string
              refresh_token: string
            }

            export function useAuth() {
              const queryClient = useQueryClient()

              const login = useMutation({
                mutationFn: async (data: LoginData) => {
                  const response = await axios.post<AuthResponse>('/api/v1/auth/login', data)
                  localStorage.setItem('access_token', response.data.access_token)
                  localStorage.setItem('refresh_token', response.data.refresh_token)
                  return response.data
                },
                onSuccess: () => {
                  queryClient.invalidateQueries({ queryKey: ['me'] })
                },
              })

              const logout = useMutation({
                mutationFn: async () => {
                  await axios.post('/api/v1/auth/logout')
                  localStorage.removeItem('access_token')
                  localStorage.removeItem('refresh_token')
                  queryClient.clear()
                },
              })

              const me = useQuery({
                queryKey: ['me'],
                queryFn: async () => {
                  const token = localStorage.getItem('access_token')
                  if (!token) return null
                  const response = await axios.get('/api/v1/auth/me', {
                    headers: { Authorization: `Bearer ${token}` },
                  })
                  return response.data
                },
                enabled: !!localStorage.getItem('access_token'),
              })

              return {
                login,
                logout,
                user: me.data,
                isLoading: me.isLoading,
                isAuthenticated: !!me.data,
              }
            }

        use_orders:
          code: |
            // src/hooks/useOrders.ts
            import { useQuery, useMutation, useQueryClient } from '@tanstack/react-query'
            import axios from 'axios'
            { z } from 'zod'

            const orderSchema = z.object({
              id: z.number(),
              order_number: z.string(),
              status: z.string(),
              total_amount: z.number(),
              created_at: z.string(),
            })

            type Order = z.infer<typeof orderSchema>

            export function useOrders(page = 1, limit = 10) {
              return useQuery({
                queryKey: ['orders', page, limit],
                queryFn: async () => {
                  const response = await axios.get('/api/v1/orders', {
                    params: { skip: (page - 1) * limit, limit },
                  })
                  return response.data
                },
              })
            }

            export function useOrder(id: number) {
              return useQuery({
                queryKey: ['order', id],
                queryFn: async () => {
                  const response = await axios.get(`/api/v1/orders/${id}`)
                  return orderSchema.parse(response.data)
                },
              })
            }

      state_management:
        zustand_store:
          code: |
            // src/store/useCartStore.ts
            import { create } from 'zustand'

            interface CartItem {
              id: number
              name: string
              price: number
              quantity: number
            }

            interface CartStore {
              items: CartItem[]
              addItem: (item: Omit<CartItem, 'quantity'>) => void
              removeItem: (id: number) => void
              updateQuantity: (id: number, quantity: number) => void
              clearCart: () => void
              total: number
            }

            export const useCartStore = create<CartStore>((set, get) => ({
              items: [],

              addItem: (item) =>
                set((state) => {
                  const existing = state.items.find((i) => i.id === item.id)
                  if (existing) {
                    return {
                      items: state.items.map((i) =>
                        i.id === item.id ? { ...i, quantity: i.quantity + 1 } : i
                      ),
                    }
                  }
                  return { items: [...state.items, { ...item, quantity: 1 }] }
                }),

              removeItem: (id) =>
                set((state) => ({
                  items: state.items.filter((i) => i.id !== id),
                })),

              updateQuantity: (id, quantity) =>
                set((state) => ({
                  items: state.items.map((i) =>
                    i.id === id ? { ...i, quantity } : i
                  ),
                })),

              clearCart: () => set({ items: [] }),

              get total: () => {
                return get().items.reduce((sum, item) => sum + item.price * item.quantity, 0)
              },
            }))

      form_handling:
        react_hook_form:
          code: |
            // src/components/OrderForm.tsx
            import { useForm } from 'react-hook-form'
            import { zodResolver } from '@hookform/resolvers/zod'
            import { z } from 'zod'
            { TextField, Button, Box } from '@mui/material'
            { useMutation } from '@tanstack/react-query'
            { axios } from 'axios'

            const orderSchema = z.object({
              customer_name: z.string().min(2, 'Name must be at least 2 characters'),
              customer_email: z.string().email('Invalid email'),
              notes: z.string().optional(),
            })

            type OrderFormData = z.infer<typeof orderSchema>

            export function OrderForm() {
              const {
                register,
                handleSubmit,
                formState: { errors },
              } = useForm<OrderFormData>({
                resolver: zodResolver(orderSchema),
              })

              const createOrder = useMutation({
                mutationFn: async (data: OrderFormData) => {
                  return axios.post('/api/v1/orders', data)
                },
                onSuccess: () => {
                  // Handle success
                },
              })

              const onSubmit = (data: OrderFormData) => {
                createOrder.mutate(data)
              }

              return (
                <Box component="form" onSubmit={handleSubmit(onSubmit)} sx={{ mt: 2 }}>
                  <TextField
                    {...register('customer_name')}
                    label="Customer Name"
                    error={!!errors.customer_name}
                    helperText={errors.customer_name?.message}
                    fullWidth
                    margin="normal"
                  />

                  <TextField
                    {...register('customer_email')}
                    label="Customer Email"
                    error={!!errors.customer_email}
                    helperText={errors.customer_email?.message}
                    fullWidth
                    margin="normal"
                  />

                  <TextField
                    {...register('notes')}
                    label="Notes"
                    multiline
                    rows={4}
                    fullWidth
                    margin="normal"
                  />

                  <Button
                    type="submit"
                    variant="contained"
                    fullWidth
                    disabled={createOrder.isPending}
                  >
                    {createOrder.isPending ? 'Creating...' : 'Create Order'}
                  </Button>
                </Box>
              )
            }

      components:
        data_table:
          code: |
            // src/components/DataTable.tsx
            import { Paper, Table, TableBody, TableCell, TableContainer, TableHead, TableRow } from '@mui/material'

            interface Column<T> {
              id: keyof T
              label: string
              render?: (value: any, row: T) => React.ReactNode
            }

            interface DataTableProps<T> {
              columns: Column<T>[]
              data: T[]
            }

            export function DataTable<T extends Record<string, any>>({
              columns,
              data,
            }: DataTableProps<T>) {
              return (
                <TableContainer component={Paper}>
                  <Table>
                    <TableHead>
                      <TableRow>
                        {columns.map((column) => (
                          <TableCell key={String(column.id)}>{column.label}</TableCell>
                        ))}
                      </TableRow>
                    </TableHead>
                    <TableBody>
                      {data.map((row, index) => (
                        <TableRow key={index}>
                          {columns.map((column) => (
                            <TableCell key={String(column.id)}>
                              {column.render
                                ? column.render(row[column.id], row)
                                : String(row[column.id])}
                            </TableCell>
                          ))}
                        </TableRow>
                      ))}
                    </TableBody>
                  </Table>
                </TableContainer>
              )
            }

  stack_c:
    name: "Desktop (PyWebview + PyInstaller)"
    description: "Desktop application with native window and WebView"
    use_case: "Installed desktop apps with POS, printer, scale integration"

    packages:
      - "pywebview>=4.4"
      - "pyinstaller>=6.0.0"

    configuration:
      setup:
        code: |
          # main.py - Desktop entry point
          import threading
          import webview
          import uvicorn
          import time
          from app.main import app as fastapi_app

          def start_server():
              """Start FastAPI server in a background thread."""
              uvicorn.run(
                  fastapi_app,
                  host="127.0.0.1",
                  port=8765,
                  log_level="warning",
                  access_log=False
              )

          if __name__ == "__main__":
              # Start FastAPI in background thread
              server_thread = threading.Thread(target=start_server, daemon=True)
              server_thread.start()

              # Wait for server to start
              time.sleep(1.5)

              # Create native window with WebView
              window = webview.create_window(
                  title="AgentCore Desktop",
                  url="http://127.0.0.1:8765",
                  width=1280,
                  height=800,
                  min_size=(1024, 768),
                  resizable=True,
                  fullscreen=False,
                  frameless=False,
              )

              # Start webview event loop
              webview.start()

    pyinstaller_config:
      code: |
        # build.spec - PyInstaller configuration
        # -*- mode: python ; coding: utf-8 -*-

        block_cipher = None

        a = Analysis(
            ['main.py'],
            pathex=[],
            binaries=[],
            datas=[
                ('app/templates', 'app/templates'),
                ('app/static', 'app/static'),
            ],
            hiddenimports=[
                'uvicorn.logging',
                'uvicorn.loops.auto',
                'uvicorn.loops.uvloop',
                'fastapi',
                'sqlalchemy',
                'pydantic',
            ],
            hookspath=[],
            hooksconfig={},
            runtime_hooks=[],
            excludes=[],
            win_no_prefer_redirects=False,
            win_private_assemblies=False,
            cipher=block_cipher,
            noarchive=False,
        )

        pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)

        exe = EXE(
            pyz,
            a.scripts,
            a.binaries,
            a.zipfiles,
            a.datas,
            [],
            name='AgentCoreDesktop',
            debug=False,
            bootloader_ignore_signals=False,
            strip=False,
            upx=True,
            upx_exclude=[],
            runtime_tmpdir=None,
            console=False,  # Hide console window
            disable_windowed_traceback=False,
            argv_emulation=False,
            target_arch=None,
            codesign_identity=None,
            entitlements_file=None,
            icon='app/static/icon.ico',
        )

    build_commands:
      build_exe:
        command: "pyinstaller build.spec --clean"
        description: "Build standalone EXE with PyInstaller"

      build_onefile:
        command: "pyinstaller --onefile --windowed --icon=app/static/icon.ico --add-data 'app/templates;app/templates' --add-data 'app/static;app/static' main.py"
        description: "Build single-file EXE"

    window_features:
      code: |
        # Advanced window configuration
        window = webview.create_window(
            title="AgentCore Desktop",
            url="http://127.0.0.1:8765",
            width=1280,
            height=800,
            x=100,  # Window position X
            y=100,  # Window position Y
            resizable=True,
            fullscreen=False,
            min_size=(1024, 768),
            max_size=(1920, 1080),
            background_color='#FFFFFF',
            text_select=False,
            frameless=False,  # Set to True for custom title bar
            easy_drag=True,
            vibrancy=False,  # macOS only
            shadow=True,
        )

    hardware_integration:
      code: |
        # Hardware integration with desktop app
        from pywebview import window

        # Expose Python functions to JavaScript
        @window.expose
        def print_ticket(order_data: dict) -> bool:
            """Print ticket using ESC/POS printer."""
            from app.hardware.printer import PrinterService
            printer = PrinterService()
            return printer.print_order(order_data)

        @window.expose
        def read_scale() -> float:
            """Read weight from serial scale."""
            from app.hardware.scale import ScaleService
            scale = ScaleService()
            return scale.read_weight()

        @window.expose
        def scan_fingerprint() -> str:
            """Scan fingerprint from biometric device."""
            from app.hardware.biometric import BiometricService
            bio = BiometricService()
            return bio.scan()

        @window.expose
        def get_app_version() -> str:
            """Get application version."""
            from app.core.config import settings
            return settings.app_version

        # JavaScript can call these functions:
        # await pywebview.api.print_ticket({...})
        # const weight = await pywebview.api.read_scale()
        # const fingerprint = await pywebview.api.scan_fingerprint()

deployment:
  stack_a:
    build_command: "No build needed - server-side rendered"
    deploy_command: "Deploy FastAPI app with gunicorn/uvicorn"

  stack_b:
    build_command: "npm run build"
    output_dir: "dist/"
    deploy_command: "Serve static files with nginx + FastAPI backend"

  stack_c:
    build_command: "pyinstaller build.spec"
    output_file: "dist/AgentCoreDesktop.exe"
    deploy_command: "Distribute EXE installer to end users"

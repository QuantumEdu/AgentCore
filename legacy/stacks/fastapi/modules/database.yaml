repositories:
  base_repository:
    code: |
      from typing import Generic, TypeVar, Type, Optional, List, Any
      from sqlalchemy.ext.asyncio import AsyncSession
      from sqlalchemy import select, update, delete, func, and_
      from sqlalchemy.orm import Mapped

      ModelType = TypeVar("ModelType", bound=Any)

      class BaseRepository(Generic[ModelType]):
          """
          Base repository with common CRUD operations.
          Provides a generic interface for database operations.
          """

          def __init__(self, model: Type[ModelType], db: AsyncSession):
              self.model = model
              self.db = db

          async def create(self, **kwargs) -> ModelType:
              """Create a new record."""
              obj = self.model(**kwargs)
              self.db.add(obj)
              await self.db.commit()
              await self.db.refresh(obj)
              return obj

          async def get_by_id(self, id: int) -> Optional[ModelType]:
              """Get a record by ID."""
              result = await self.db.execute(
                  select(self.model).where(self.model.id == id)
              )
              return result.scalar_one_or_none()

          async def get_all(
              self,
              skip: int = 0,
              limit: int = 100,
              order_by: str | None = None
          ) -> List[ModelType]:
              """Get all records with pagination."""
              query = select(self.model)

              if order_by:
                  if order_by.startswith("-"):
                      query = query.order_by(getattr(self.model, order_by[1:]).desc())
                  else:
                      query = query.order_by(getattr(self.model, order_by).asc())

              query = query.offset(skip).limit(limit)
              result = await self.db.execute(query)
              return list(result.scalars().all())

          async def update(self, id: int, **kwargs) -> Optional[ModelType]:
              """Update a record by ID."""
              await self.db.execute(
                  update(self.model)
                  .where(self.model.id == id)
                  .values(**kwargs)
              )
              await self.db.commit()
              return await self.get_by_id(id)

          async def delete(self, id: int) -> bool:
              """Delete a record by ID (hard delete)."""
              result = await self.db.execute(
                  delete(self.model).where(self.model.id == id)
              )
              await self.db.commit()
              return result.rowcount > 0

          async def soft_delete(self, id: int) -> Optional[ModelType]:
              """Soft delete a record by ID."""
              obj = await self.get_by_id(id)
              if obj and hasattr(obj, "soft_delete"):
                  obj.soft_delete()
                  await self.db.commit()
                  await self.db.refresh(obj)
              return obj

          async def count(self, filters: dict | None = None) -> int:
              """Count records with optional filters."""
              query = select(func.count()).select_from(self.model)

              if filters:
                  conditions = [
                      getattr(self.model, key) == value
                      for key, value in filters.items()
                  ]
                  if conditions:
                      query = query.where(and_(*conditions))

              result = await self.db.execute(query)
              return result.scalar()

          async def exists(self, id: int) -> bool:
              """Check if a record exists by ID."""
              return await self.get_by_id(id) is not None

          async def bulk_create(self, items: List[dict]) -> List[ModelType]:
              """Create multiple records in a single transaction."""
              objects = [self.model(**item) for item in items]
              self.db.add_all(objects)
              await self.db.commit()
              for obj in objects:
                  await self.db.refresh(obj)
              return objects

  user_repository_example:
    code: |
      from typing import Optional, List
      from sqlalchemy import select
      from sqlalchemy.ext.asyncio import AsyncSession
      from app.infrastructure.persistence.models import User, UserRole
      from app.infrastructure.persistence.repositories.base import BaseRepository

      class UserRepository(BaseRepository[User]):
          """
          Repository for User model with specific queries.
          """

          def __init__(self, db: AsyncSession):
              super().__init__(User, db)

          async def get_by_email(self, email: str) -> Optional[User]:
              """Get a user by email address."""
              result = await self.db.execute(
                  select(User).where(User.email == email)
              )
              return result.scalar_one_or_none()

          async def get_by_role(
              self,
              role: UserRole,
              skip: int = 0,
              limit: int = 100
          ) -> List[User]:
              """Get users by role."""
              result = await self.db.execute(
                  select(User)
                  .where(User.role == role)
                  .offset(skip)
                  .limit(limit)
              )
              return list(result.scalars().all())

          async def search(
              self,
              query: str,
              skip: int = 0,
              limit: int = 100
          ) -> List[User]:
              """Search users by name or email."""
              search_pattern = f"%{query}%"
              result = await self.db.execute(
                  select(User)
                  .where(
                      (User.full_name.ilike(search_pattern)) |
                      (User.email.ilike(search_pattern))
                  )
                  .offset(skip)
                  .limit(limit)
              )
              return list(result.scalars().all())

          async def get_active_users(
              self,
              skip: int = 0,
              limit: int = 100
          ) -> List[User]:
              """Get all active (non-deleted) users."""
              result = await self.db.execute(
                  select(User)
                  .where(User.deleted_at.is_(None))
                  .where(User.is_active == True)
                  .offset(skip)
                  .limit(limit)
              )
              return list(result.scalars().all())

async_session:
  configuration:
    code: |
      from sqlalchemy.ext.asyncio import create_async_engine, AsyncSession, async_sessionmaker
      from app.core.config import settings

      # Create async engine
      engine = create_async_engine(
          settings.async_database_url,
          echo=settings.echo_sql,
          pool_size=settings.pool_size,
          max_overflow=settings.max_overflow,
          pool_timeout=settings.pool_timeout,
          pool_recycle=settings.pool_recycle,
      )

      # Create async session factory
      async_session_maker = async_sessionmaker(
          engine,
          class_=AsyncSession,
          expire_on_commit=False,
      )

      async def get_db() -> AsyncSession:
          """
          Dependency for FastAPI to get database session.
          """
          async with async_session_maker() as session:
              try:
                  yield session
              finally:
                  await session.close()

indexes:
  recommended:
    users:
      - columns: ["email"]
        unique: true
        rationale: "Prevent duplicate email addresses"

      - columns: ["role"]
        unique: false
        rationale: "Optimize queries filtering by role"

      - columns: ["deleted_at"]
        unique: false
        rationale: "Optimize soft delete queries"

      - columns: ["is_active", "deleted_at"]
        unique: false
        rationale: "Optimize active user queries"

    orders:
      - columns: ["order_number"]
        unique: true
        rationale: "Prevent duplicate order numbers"

      - columns: ["user_id"]
        unique: false
        rationale: "Optimize user's orders queries"

      - columns: ["status"]
        unique: false
        rationale: "Optimize order status filtering"

      - columns: ["status", "created_at"]
        unique: false
        rationale: "Optimize dashboard queries for recent orders by status"

    order_items:
      - columns: ["order_id"]
        unique: false
        rationale: "Optimize order items retrieval"

      - columns: ["product_id"]
        unique: false
        rationale: "Optimize product sales analysis"

performance:
  optimizations:
    - name: "Connection Pooling"
      description: "Use SQLAlchemy connection pooling to reuse database connections"
      implementation: "Configured in async engine with pool_size, max_overflow, pool_timeout"

    - name: "Eager Loading"
      description: "Use selectinload() or joinedload() to avoid N+1 queries"
      implementation: |
        # Example:
        from sqlalchemy.orm import selectinload
        result = await db.execute(
            select(Order)
            .options(selectinload(Order.items))
            .where(Order.id == order_id)
        )

    - name: "Partial Indexes"
      description: "Create indexes on frequently queried subsets of data"
      implementation: "CREATE INDEX idx_active_users ON users (is_active, deleted_at) WHERE deleted_at IS NULL"

    - name: "Batch Operations"
      description: "Use bulk operations for inserting/updating multiple records"
      implementation: |
        # Example:
        await db.execute(
            insert(User).values([
                {"email": "user1@example.com", "full_name": "User 1"},
                {"email": "user2@example.com", "full_name": "User 2"},
            ])
        )
        await db.commit()

    - name: "Query Optimization"
      description: "Use only() to select only needed columns"
      implementation: |
        # Example:
        result = await db.execute(
            select(User.id, User.email, User.full_name)
            .where(User.role == UserRole.ADMIN)
        )

    - name: "Read Replicas"
      description: "Route read queries to read replicas for scaling"
      implementation: "Configure separate engine for reads in production"


printers:
  python_escpos:
    description: "Library for ESC/POS thermal printers"
    supported_printers:
      - "Epson TM-T88 series"
      - "Star Micronics mC-Print3"
      - "Custom USB thermal printers"
      - "Network thermal printers"
      - "Bluetooth thermal printers (with adapter)"

    configuration: |
      # app/hardware/printer.py
      from escpos.printer import Usb, Network, Serial, File
      from escpos.exceptions import PrinterError
      from typing import Optional
      from app.core.config import settings

      class PrinterService:
          """
          Service for ESC/POS thermal printer operations.
          Supports USB, Network, Serial, and File printers.
          """

          def __init__(
              self,
              printer_type: str = "usb",
              vendor_id: Optional[int] = None,
              product_id: Optional[int] = None,
              ip_address: Optional[str] = None,
              port: Optional[str] = None,
          ):
              self.printer_type = printer_type
              self.vendor_id = vendor_id or settings.printer_vendor_id
              self.product_id = product_id or settings.printer_product_id
              self.ip_address = ip_address or settings.printer_ip_address
              self.port = port or settings.printer_serial_port
              self.printer = None

          def connect(self) -> bool:
              """Establish connection to the printer."""
              try:
                  if self.printer_type == "usb":
                      self.printer = Usb(
                          self.vendor_id,
                          self.product_id,
                          timeout=5000
                      )
                  elif self.printer_type == "network":
                      self.printer = Network(
                          self.ip_address,
                          port=9100
                      )
                  elif self.printer_type == "serial":
                      self.printer = Serial(
                          devfile=self.port,
                          baudrate=9600
                      )
                  elif self.printer_type == "file":
                      self.printer = File(
                          devfile="/dev/usb/lp0"
                      )
                  else:
                      raise ValueError(f"Unsupported printer type: {self.printer_type}")

                  return True
              except Exception as e:
                  print(f"Printer connection error: {e}")
                  return False

          def print_text(self, text: str, align: str = "left", font: str = "a") -> bool:
              """Print plain text."""
              try:
                  if not self.printer:
                      self.connect()

                  self.printer.set(align=align, font=font)
                  self.printer.text(text)
                  self.printer._raw(b"\n\n")
                  return True
              except PrinterError as e:
                  print(f"Print error: {e}")
                  return False

          def print_barcode(
              self,
              code: str,
              barcode_type: str = "EAN13",
              height: int = 100,
              width: int = 2
          ) -> bool:
              """Print a barcode."""
              try:
                  if not self.printer:
                      self.connect()

                  self.printer.barcode(
                      code,
                      barcode_type,
                      height=height,
                      width=width
                  )
                  self.printer._raw(b"\n\n")
                  return True
              except PrinterError as e:
                  print(f"Barcode print error: {e}")
                  return False

          def print_qrcode(self, data: str, size: int = 6) -> bool:
              """Print a QR code."""
              try:
                  if not self.printer:
                      self.connect()

                  self.printer.qr(data, size=size)
                  self.printer._raw(b"\n\n")
                  return True
              except PrinterError as e:
                  print(f"QR code print error: {e}")
                  return False

          def cut_paper(self, mode: str = "full") -> bool:
              """Cut the paper."""
              try:
                  if not self.printer:
                      self.connect()

                  self.printer.cut(mode=mode)
                  return True
              except PrinterError as e:
                  print(f"Cut error: {e}")
                  return False

          def print_receipt(self, receipt_data: dict) -> bool:
              """Print a complete receipt."""
              try:
                  if not self.printer:
                      self.connect()

                  self.printer._raw(b"\x1B\x40")
                  self.printer.set(align="center", font="a", bold=True)
                  self.printer.text(f"{receipt_data.get('store_name', 'STORE')}\n")
                  self.printer.set(align="center", bold=False)
                  self.printer.text(f"{receipt_data.get('address', '')}\n")
                  self.printer.text(f"Tel: {receipt_data.get('phone', '')}\n")
                  self.printer.text("-" * 32 + "\n\n")

                  self.printer.set(align="left")
                  self.printer.text(f"Order #: {receipt_data.get('order_number', '')}\n")
                  self.printer.text(f"Date: {receipt_data.get('date', '')}\n")
                  self.printer.text(f"Cashier: {receipt_data.get('cashier', '')}\n\n")

                  self.printer.text("-" * 32 + "\n")
                  self.printer.set(align="left", bold=True)
                  self.printer.text("ITEM                     QTY  TOTAL\n")
                  self.printer.text("-" * 32 + "\n")
                  self.printer.set(bold=False)

                  for item in receipt_data.get('items', []):
                      name = item.get('name', '')[:20].ljust(20)
                      qty = str(item.get('quantity', 0)).rjust(4)
                      total = f"${item.get('total', 0):.2f}".rjust(8)
                      self.printer.text(f"{name}{qty}{total}\n")

                  self.printer.text("-" * 32 + "\n")
                  self.printer.set(align="right")
                  self.printer.text(f"Subtotal: ${receipt_data.get('subtotal', 0):.2f}\n")
                  self.printer.text(f"Tax: ${receipt_data.get('tax', 0):.2f}\n")
                  self.printer.set(bold=True, height=2)
                  self.printer.text(f"TOTAL: ${receipt_data.get('total', 0):.2f}\n")
                  self.printer.set(bold=False, height=1)

                  self.printer.text(f"Paid: ${receipt_data.get('paid', 0):.2f}\n")
                  self.printer.text(f"Change: ${receipt_data.get('change', 0):.2f}\n\n")

                  self.printer.set(align="center")
                  self.printer.text("Thank you for your purchase!\n")
                  self.printer.text(f"{receipt_data.get('footer_message', '')}\n\n")

                  if receipt_data.get('qr_code'):
                      self.printer.qr(receipt_data['qr_code'], size=6)
                      self.printer._raw(b"\n\n")

                  self.printer.cut(mode="full")
                  return True
              except PrinterError as e:
                  print(f"Receipt print error: {e}")
                  return False

          def close(self):
              """Close printer connection."""
              if self.printer:
                  self.printer.close()

    config_settings: |
      # app/core/config.py (additions)
      class Settings(BaseSettings):
          # Printer Configuration
          printer_type: str = "usb"
          printer_vendor_id: int = 0x0456
          printer_product_id: int = 0x0808
          printer_ip_address: str = "192.168.1.100"
          printer_serial_port: str = "COM1"

scales:
  pyserial:
    description: "Library for serial scale communication"
    supported_scales:
      - "Mettler Toledo scales"
      - "OHAUS scales"
      - "Generic RS-232 scales"

    configuration: |
      # app/hardware/scale.py
      import serial
      from serial.tools import list_ports
      from typing import Optional
      import re
      from app.core.config import settings

      class ScaleService:
          """
          Service for reading weight from serial scales.
          Supports various scale protocols (Mettler Toledo, OHAUS, etc.).
          """

          def __init__(
              self,
              port: Optional[str] = None,
              baudrate: int = 9600,
              timeout: float = 1.0,
              protocol: str = "mettler"
          ):
              self.port = port or settings.scale_port
              self.baudrate = baudrate
              self.timeout = timeout
              self.protocol = protocol
              self.serial_connection = None

          def list_available_ports(self) -> list:
              """List all available serial ports."""
              ports = list_ports.comports()
              return [
                  {
                      "device": port.device,
                      "description": port.description,
                      "hwid": port.hwid,
                  }
                  for port in ports
              ]

          def connect(self) -> bool:
              """Establish connection to the scale."""
              try:
                  self.serial_connection = serial.Serial(
                      port=self.port,
                      baudrate=self.baudrate,
                      timeout=self.timeout,
                      bytesize=serial.EIGHTBITS,
                      parity=serial.PARITY_NONE,
                      stopbits=serial.STOPBITS_ONE
                  )
                  return True
              except Exception as e:
                  print(f"Scale connection error: {e}")
                  return False

          def disconnect(self):
              """Close serial connection."""
              if self.serial_connection and self.serial_connection.is_open:
                  self.serial_connection.close()

          def send_command(self, command: bytes) -> Optional[bytes]:
              """Send command to scale and read response."""
              try:
                  if not self.serial_connection or not self.serial_connection.is_open:
                      if not self.connect():
                          return None

                  self.serial_connection.write(command)
                  response = self.serial_connection.read_all()
                  return response
              except Exception as e:
                  print(f"Scale communication error: {e}")
                  return None

          def read_weight(self) -> Optional[float]:
              """Read current weight from scale."""
              try:
                  if self.protocol == "mettler":
                      response = self.send_command(b'W\r\n')
                      if response:
                          match = re.search(r'[-+]?\d*\.?\d+', response.decode('ascii', errors='ignore'))
                          if match:
                              return float(match.group())

                  elif self.protocol == "ohaus":
                      response = self.send_command(b'P\r\n')
                      if response:
                          match = re.search(r'[-+]?\d*\.?\d+', response.decode('ascii', errors='ignore'))
                          if match:
                              return float(match.group())

                  elif self.protocol == "generic":
                      response = self.send_command(b'\x1B\x50')
                      if response:
                          match = re.search(r'[-+]?\d*\.?\d+', response.decode('ascii', errors='ignore'))
                          if match:
                              return float(match.group())

                  return None
              except Exception as e:
                  print(f"Weight read error: {e}")
                  return None

          def tare(self) -> bool:
              """Tare the scale (zero out)."""
              try:
                  if self.protocol == "mettler":
                      response = self.send_command(b'T\r\n')
                      return response is not None
                  elif self.protocol == "ohaus":
                      response = self.send_command(b'T\r\n')
                      return response is not None
                  return False
              except Exception as e:
                  print(f"Tare error: {e}")
                  return False

          def zero(self) -> bool:
              """Zero the scale."""
              try:
                  if self.protocol == "mettler":
                      response = self.send_command(b'Z\r\n')
                      return response is not None
                  elif self.protocol == "ohaus":
                      response = self.send_command(b'Z\r\n')
                      return response is not None
                  return False
              except Exception as e:
                  print(f"Zero error: {e}")
                  return False

          def is_stable(self) -> bool:
              """Check if the scale reading is stable."""
              try:
                  if self.protocol == "mettler":
                      response = self.send_command(b'US\r\n')
                      if response:
                          return b'S' in response
                  elif self.protocol == "ohaus":
                      response = self.send_command(b'US\r\n')
                      if response:
                          return b'S' in response
                  return True
              except Exception as e:
                  print(f"Stability check error: {e}")
                  return False

          def __enter__(self):
              """Context manager entry."""
              self.connect()
              return self

          def __exit__(self, exc_type, exc_val, exc_tb):
              """Context manager exit."""
              self.disconnect()

    config_settings: |
      # app/core/config.py (additions)
      class Settings(BaseSettings):
          # Scale Configuration
          scale_port: str = "COM1"
          scale_baudrate: int = 9600
          scale_protocol: str = "mettler"
          scale_timeout: float = 1.0

biometrics:
  ctypes:
    description: "Library for biometric device integration via DLL/Shared Library"
    supported_devices:
      - "DigitalPersona U.are.U fingerprint readers"
      - "SecuGen fingerprint readers"
      - "Neurotechnology MegaMatcher"
      - "Generic fingerprint SDKs with DLL interface"

    configuration: |
      # app/hardware/biometric.py
      import ctypes
      from ctypes import wintypes
      from typing import Optional, Tuple
      import os
      from app.core.config import settings

      class BiometricService:
          """
          Service for biometric device integration using ctypes.
          Example implementation for DigitalPersona U.are.U SDK.
          """

          def __init__(self, dll_path: Optional[str] = None):
              self.dll_path = dll_path or settings.biometric_dll_path
              self.dll = None
              self.device_handle = None
              self._load_library()

          def _load_library(self) -> bool:
              """Load the biometric SDK DLL."""
              try:
                  if not os.path.exists(self.dll_path):
                      print(f"Biometric DLL not found: {self.dll_path}")
                      return False

                  self.dll = ctypes.CDLL(self.dll_path)
                  return True
              except Exception as e:
                  print(f"Failed to load biometric DLL: {e}")
                  return False

          def initialize(self) -> bool:
              """Initialize the biometric device."""
              try:
                  if not self.dll:
                      return False

                  self.dll.Initialize.argtypes = []
                  self.dll.Initialize.restype = wintypes.BOOL

                  result = self.dll.Initialize()
                  if result:
                      self.dll.OpenDevice.argtypes = []
                      self.dll.OpenDevice.restype = wintypes.HANDLE

                      self.device_handle = self.dll.OpenDevice()
                      return self.device_handle is not None

                  return False
              except Exception as e:
                  print(f"Biometric initialization error: {e}")
                  return False

          def capture_fingerprint(self, timeout_ms: int = 10000) -> Optional[bytes]:
              """Capture a fingerprint from the device."""
              try:
                  if not self.dll or not self.device_handle:
                      return None

                  self.dll.CaptureFingerprint.argtypes = [
                      wintypes.HANDLE,
                      wintypes.DWORD,
                      ctypes.POINTER(wintypes.BYTE),
                      wintypes.DWORD
                  ]
                  self.dll.CaptureFingerprint.restype = wintypes.BOOL

                  buffer_size = 1024
                  buffer = (wintypes.BYTE * buffer_size)()

                  result = self.dll.CaptureFingerprint(
                      self.device_handle,
                      timeout_ms,
                      buffer,
                      buffer_size
                  )

                  if result:
                      return bytes(buffer)
                  return None
              except Exception as e:
                  print(f"Fingerprint capture error: {e}")
                  return None

          def verify_fingerprint(
              self,
              captured_template: bytes,
              stored_template: bytes
          ) -> Tuple[bool, float]:
              """Verify a captured fingerprint against a stored template."""
              try:
                  if not self.dll:
                      return False, 0.0

                  self.dll.VerifyFingerprint.argtypes = [
                      ctypes.POINTER(wintypes.BYTE),
                      wintypes.DWORD,
                      ctypes.POINTER(wintypes.BYTE),
                      wintypes.DWORD,
                      ctypes.POINTER(wintypes.FLOAT)
                  ]
                  self.dll.VerifyFingerprint.restype = wintypes.BOOL

                  captured_array = (wintypes.BYTE * len(captured_template)).from_buffer_copy(captured_template)
                  stored_array = (wintypes.BYTE * len(stored_template)).from_buffer_copy(stored_template)

                  match_score = wintypes.FLOAT()

                  result = self.dll.VerifyFingerprint(
                      captured_array,
                      len(captured_template),
                      stored_array,
                      len(stored_template),
                      ctypes.byref(match_score)
                  )

                  if result:
                      threshold = settings.biometric_match_threshold
                      return match_score.value >= threshold, match_score.value

                  return False, 0.0
              except Exception as e:
                  print(f"Fingerprint verification error: {e}")
                  return False, 0.0

          def enroll_fingerprint(self, user_id: int) -> Optional[bytes]:
              """Enroll a new fingerprint for a user."""
              try:
                  if not self.dll or not self.device_handle:
                      return None

                  self.dll.EnrollFingerprint.argtypes = [
                      wintypes.HANDLE,
                      wintypes.INT,
                      ctypes.POINTER(wintypes.BYTE),
                      wintypes.DWORD
                  ]
                  self.dll.EnrollFingerprint.restype = wintypes.BOOL

                  buffer_size = 1024
                  buffer = (wintypes.BYTE * buffer_size)()

                  result = self.dll.EnrollFingerprint(
                      self.device_handle,
                      user_id,
                      buffer,
                      buffer_size
                  )

                  if result:
                      return bytes(buffer)
                  return None
              except Exception as e:
                  print(f"Fingerprint enrollment error: {e}")
                  return None

          def close(self):
              """Close the biometric device."""
              try:
                  if self.dll and self.device_handle:
                      self.dll.CloseDevice.argtypes = [wintypes.HANDLE]
                      self.dll.CloseDevice.restype = wintypes.BOOL

                      self.dll.CloseDevice(self.device_handle)
                      self.device_handle = None

                  if self.dll:
                      if hasattr(self.dll, 'Cleanup'):
                          self.dll.Cleanup()
              except Exception as e:
                  print(f"Biometric close error: {e}")

          def __enter__(self):
              """Context manager entry."""
              self.initialize()
              return self

          def __exit__(self, exc_type, exc_val, exc_tb):
              """Context manager exit."""
              self.close()

    config_settings: |
      # app/core/config.py (additions)
      class Settings(BaseSettings):
          # Biometric Configuration
          biometric_dll_path: str = "C:/Program Files/DigitalPersona/U.are.U SDK/bin/dpfpdd.dll"
          biometric_match_threshold: float = 0.7
          biometric_capture_timeout_ms: int = 10000

integration_examples:
  pos_system: |
    # Example: POS system with printer and scale integration
    from fastapi import APIRouter, Depends, HTTPException
    from app.hardware.printer import PrinterService
    from app.hardware.scale import ScaleService
    from app.application.auth.dependencies import get_current_user
    from app.infrastructure.persistence.models import User

    router = APIRouter()

    @router.post("/pos/sale")
    async def process_sale(
        sale_data: dict,
        current_user: User = Depends(get_current_user)
    ):
        """Process a sale and print receipt."""
        try:
            total = sale_data.get('total', 0)
            if total <= 0:
                raise HTTPException(status_code=400, detail="Invalid total")

            printer = PrinterService()
            receipt_data = {
                'store_name': 'My Store',
                'address': '123 Main St',
                'phone': '555-1234',
                'order_number': sale_data['order_number'],
                'date': sale_data['date'],
                'cashier': current_user.full_name,
                'items': sale_data['items'],
                'subtotal': sale_data['subtotal'],
                'tax': sale_data['tax'],
                'total': total,
                'paid': sale_data['paid'],
                'change': sale_data['change'],
                'qr_code': f"ORDER:{sale_data['order_number']}",
                'footer_message': 'Thank you for shopping with us!'
            }

            success = printer.print_receipt(receipt_data)
            if not success:
                raise HTTPException(status_code=500, detail="Failed to print receipt")

            return {"success": True, "message": "Sale processed and receipt printed"}
        except Exception as e:
            raise HTTPException(status_code=500, detail=str(e))

    @router.get("/scale/weight")
    async def read_scale_weight(
        current_user: User = Depends(get_current_user)
    ):
        """Read current weight from scale."""
        try:
            with ScaleService() as scale:
                weight = scale.read_weight()
                if weight is None:
                    raise HTTPException(status_code=500, detail="Failed to read weight")

                stable = scale.is_stable()
                return {
                    "weight": weight,
                    "unit": "kg",
                    "stable": stable
                }
        except Exception as e:
            raise HTTPException(status_code=500, detail=str(e))

  employee_clock_in: |
    # Example: Employee clock-in with fingerprint
    from fastapi import APIRouter, Depends, HTTPException
    from app.hardware.biometric import BiometricService
    from app.infrastructure.persistence.models import User
    from sqlalchemy import select
    from sqlalchemy.ext.asyncio import AsyncSession
    from datetime import datetime

    router = APIRouter()

    @router.post("/attendance/clock-in")
    async def clock_in_with_fingerprint(
        fingerprint_template: bytes,
        db: AsyncSession = Depends(get_db)
    ):
        """Clock in employee using fingerprint."""
        try:
            result = await db.execute(
                select(User).where(User.role == "employee")
            )
            employees = result.scalars().all()

            with BiometricService() as bio:
                for employee in employees:
                    if not employee.fingerprint_template:
                        continue

                    verified, score = bio.verify_fingerprint(
                        fingerprint_template,
                        employee.fingerprint_template
                    )

                    if verified:
                        attendance = Attendance(
                            user_id=employee.id,
                            clock_in=datetime.utcnow(),
                            type="clock_in"
                        )
                        db.add(attendance)
                        await db.commit()

                        return {
                            "success": True,
                            "user": employee.full_name,
                            "match_score": score
                        }

            raise HTTPException(status_code=401, detail="Fingerprint not recognized")
        except Exception as e:
            raise HTTPException(status_code=500, detail=str(e))

---
# FastAPI Stack C: Desktop (PyWebview)

substack:
  id: "fastapi_desktop"
  name: "Stack C: Desktop (PyWebview + PyInstaller)"
  description: "Desktop app con Python backend, ideal para POS, sistemas locales y apps instalables"

  triggers:
    - "[x] FastAPI Stack C"
    - "PyWebview"
    - "app instalada"
    - "desktop"
    - "POS"
    - "sin internet"
    - "offline"

  frontend:
    framework: "PyWebview 4+"
    css: "Mismo que SSR o SPA (según elección)"
    shell: "Native OS window"
    packaging: "PyInstaller"
    rationale: "App nativa, backend Python, funciona offline"

  patterns:
    - "FastAPI server en thread local (localhost:8765)"
    - "PyWebview window que carga localhost"
    - "Comunicación vía HTTP local o python-bridge"
    - "PyInstaller para empaquetar como .exe/.dmg/.AppImage"
    - "Auto-updater con wails-electron-updater o squirrel"

  structure:
    - "app/desktop/main.py"
    - "app/desktop/window.py"
    - "app/desktop/updater.py"
    - "dist/ (binarios generados)"

  examples:
    - "PyWebview create_window con HTTP server"
    - "PyInstaller --onefile --windowed"
    - "Comunicación frontend-backend via fetch('http://localhost:8765/api')"
    - "Offline support con service worker (si SPA)"

  hardware:
    impresora: "python-escpos (Epson TM-T20, Xprinter, Star)"
    báscula: "pyserial (RS232, USB serial)"
    biométrico: "ctypes → DLL (DigitalPersona, HID)"

  tradeoffs:
    - "✅ App nativa instalable"
    - "✅ Funciona offline"
    - "✅ Acceso a hardware nativo"
    - "✅ Sin dependencias de navegador"
    - "❌ Solo un sistema operativo por binario"
    - "❌ Actualizaciones manuales (auto-updater ayuda)"
    - "❌ Menos portátil que web"

  use_cases:
    - "POS de restaurantes/tiendas"
    - "Sistemas clínicos con hardware"
    - "Apps donde offline es crítico"
    - "Sistemas con integración de hardware específico"

  not_recommended_for:
    - "Apps donde multi-plataforma web es suficiente"
    - "Sistemas que requieren actualizaciones frecuentes"
    - "Apps donde el acceso desde cualquier dispositivo es necesario"

  deployment:
    build: "pyinstaller --onefile --windowed --icon=icon.ico --name=MyApp app/desktop/main.py"
    size: "~50-80 MB para .exe"
    installation: "Installer opcional (NSIS, Inno Setup)"
    auto_update: "wails-electron-updater o squirrel"

---
# FastAPI Stack A: SSR (Server-Side Rendering)

substack:
  id: "fastapi_ssr"
  name: "Stack A: SSR (Jinja2 + HTMX + PicoCSS)"
  description: "Server-side rendering ideal para apps internas, dashboards y sistemas administrativos"

  triggers:
    - "[x] FastAPI Stack A"
    - "Jinja2"
    - "HTMX"
    - "app interna"
    - "dashboard"
    - "PicoCSS"
    - "sin build step"

  frontend:
    framework: "Jinja2 3.1+"
    css: "PicoCSS 2.x (CDN)"
    interactivity: "HTMX 2.0 (CDN)"
    rationale: "No build step, simple, rápido, ideal para equipos pequeños"

  patterns:
    - "HTMX fragment endpoints"
    - "hx-get para actualizaciones"
    - "hx-trigger para eventos"
    - "hx-swap para intercambio de contenido"
    - "PicoCSS clases semánticas"

  structure:
    - "app/templates/"
    - "app/templates/components/"
    - "app/templates/pages/"
    - "app/static/css/"
    - "app/static/js/"

  examples:
    - "HTMX search con hx-trigger='keyup changed delay:300ms'"
    - "HTMX infinite scroll con hx-trigger='scrolled-into-view'"
    - "PicoCSS forms con classes: .form, .input, .button"

  tradeoffs:
    - "✅ Sin build step, deployment simple"
    - "✅ Rápido para desarrolladores con conocimientos backend"
    - "✅ Buen SEO (rendering en servidor)"
    - "❌ Menos interactividad que SPA"
    - "❌ Requiere recarga parcial (HTMX)"
    - "❌ Experiencia de usuario menos fluida que SPA"

  use_cases:
    - "Apps internas de empresa"
    - "Dashboards administrativos"
    - "Sistemas de gestión (ERP, CRM)"
    - "Aplicaciones donde la velocidad de desarrollo es prioridad"

  not_recommended_for:
    - "Aplicaciones con alta interactividad (juegos, editores)"
    - "Apps móviles (PWA es posible pero no óptimo)"
    - "Sistemas donde el UX premium es crítico"

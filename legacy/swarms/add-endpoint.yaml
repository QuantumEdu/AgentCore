# .claude/swarms/add-endpoint.yaml
# Add Endpoint Swarm
# Add a new endpoint to the API

swarm_name: "add-endpoint"
version: "1.0"
strategy: "sequential"

description: |
  Workflow for adding a new REST endpoint to the API.
  Uses existing skills and follows established patterns.

# Required context
required_context:
  - "stack_config.json"
  - ".claude/skills/fastapi-crud/"
  - ".claude/rules/api-design.rules"

# User inputs
inputs:
  - name: "resource_name"
    description: "Name of the resource (e.g. projects, tasks, sprints)"
    type: "string"
    required: true

  - name: "fields"
    description: "List of resource fields"
    type: "list"
    required: true
    example: ["name:string", "budget_allocation:float", "story_points:int"]

  - name: "operations"
    description: "CRUD operations to implement"
    type: "list"
    default: ["create", "read", "update", "delete"]

# Participants
participants:
  - agent: "architect.agent"
    phase: "design"
    task: |
      1. Validate resource does not already exist
      2. Define endpoint structure
      3. Define Pydantic schemas
      4. Approve design before implementation
    output_to: "coder.agent"
    design_output:
      - "URL structure"
      - "Request/Response schemas"
      - "Necessary validations"

  - agent: "coder.agent"
    phase: "implementation"
    task: |
      1. Use fastapi-crud skill as base
      2. Replace {Resource} with resource name
      3. Implement specific fields
      4. Create Pydantic schemas
      5. Create basic use case
    depends_on: "architect.agent"
    output_to: "tester.agent"
    use_skills:
      - "fastapi-crud/templates/endpoint_template.py"
      - "fastapi-crud/templates/schema_template.py"

  - agent: "tester.agent"
    phase: "testing"
    task: |
      1. Create tests for each endpoint
      2. Test create resource
      3. Test list resources
      4. Test get by ID
      5. Test update
      6. Test delete
      7. Test error cases (404, 400)
    depends_on: "coder.agent"
    output_to: "reviewer.agent"

  - agent: "reviewer.agent"
    phase: "documentation"
    task: |
      1. Update docs/API.md
      2. Add usage examples
      3. Document in OpenAPI/Swagger
    depends_on: "tester.agent"

# Generated files
generated_files:
  - "app/api/v1/{resource}.py"
  - "app/schemas/{resource}.py"
  - "app/services/{resource}.py"
  - "tests/test_{resource}_api.py"

# Validations
validations:
  pre_implementation:
    - "Resource does not already exist"
    - "Name follows conventions (plural, lowercase, English)"

  post_implementation:
    - "All tests pass"
    - "Coverage >= 80%"
    - "Documentation updated"

# Usage example
example:
  input:
    resource_name: "sprints"
    fields:
      - "name:string:required"
      - "budget_allocation:float:min=0"
      - "story_points:int:default=0"
    operations:
      - "create"
      - "read"
      - "close"

  output_structure: |
    app/
    ├── api/v1/
    │   └── sprints.py
    ├── schemas/
    │   └── sprints.py
    ├── services/
    │   └── sprints.py
    tests/
    └── test_sprints_api.py
